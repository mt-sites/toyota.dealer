*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth}
body{font-family:'Poppins',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--ink);
  min-height:100vh;padding:calc(14px + var(--safe-t)) 14px calc(28px + var(--safe-b));display:flex;justify-content:center}
.wrap{width:100%;max-width:460px}

/* brand header */
.brand{display:flex;align-items:center;justify-content:center;gap:10px;padding:6px 0 14px}
.brand img{width:44px;height:44px;display:block}
.brand span{font-weight:700;font-size:1.25rem;letter-spacing:.2px;color:#2f5fe0}
.brand span b{color:#f2a900;font-weight:700}

.card{background:var(--card);border-radius:26px;box-shadow:0 10px 40px rgba(20,20,40,.10);overflow:hidden}

/* photo holder */
.photo{position:relative;width:100%;aspect-ratio:4/4.4;background-color:var(--ph2);background-image:var(--pat,none),linear-gradient(160deg,var(--ph1),var(--ph2));background-size:cover,auto;background-position:center;cursor:pointer;overflow:hidden}
.photo img{position:absolute;left:0;top:0;max-width:none;display:none;user-select:none;-webkit-user-select:none;-webkit-user-drag:none;pointer-events:none}
.photo.has img{display:block}
.photo .ph{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;color:var(--muted);font-size:.85rem;text-align:center;padding:20px}
.photo.has .ph{display:none}
.photo .ph svg{width:54px;height:54px}
.photo .tools{position:absolute;right:12px;bottom:12px;display:flex;gap:8px}
.photo .edit{background:rgba(0,0,0,.55);color:#fff;border:0;border-radius:999px;padding:8px 14px;
  font:600 .75rem 'Poppins',sans-serif;display:flex;gap:6px;align-items:center;backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);cursor:pointer}
.photo .edit svg{width:14px;height:14px}
.photo.adjusting{cursor:grab;touch-action:none;outline:3px solid var(--accent);outline-offset:-3px}
.photo.adjusting:active{cursor:grabbing}
.adj{padding:16px 22px 0;display:grid;gap:10px}
.adj[hidden]{display:none}
.adj label{display:grid;grid-template-columns:92px 1fr;align-items:center;gap:10px;font-size:.78rem;font-weight:600;color:var(--muted)}
.adj input[type=range]{width:100%;accent-color:var(--accent)}
.adj .adjb{display:flex;gap:10px;justify-content:flex-end}
.adj .adjb button{font:600 .78rem 'Poppins',sans-serif;border:0;border-radius:999px;padding:9px 16px;cursor:pointer;background:rgba(128,128,140,.18);color:var(--ink)}
.adj .adjb button.go{background:var(--p1,var(--accent));color:var(--ptxt,#fff)}
.bar{height:9px;margin:0 22px;border-radius:99px;background:var(--bar,linear-gradient(90deg,var(--accent-dark),var(--accent),var(--accent-dark)));margin-top:-4px;position:relative;box-shadow:0 3px 8px rgba(125,6,16,.35)}

.who{text-align:center;padding:22px 22px 6px}
.who h1{font-size:1.45rem;line-height:1.2;font-weight:700}
.who .role{margin-top:4px;color:var(--muted);font-size:.95rem}
.who .desc{margin-top:14px;font-size:.9rem;line-height:1.55;color:var(--ink2)}

.sec{padding:20px 20px 4px}
.sec-h{display:flex;align-items:center;gap:10px;font-weight:700;letter-spacing:1.6px;font-size:.82rem;text-transform:uppercase}
.sec-h i{width:30px;height:30px;border-radius:9px;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center}
.sec-h i svg{width:17px;height:17px}
.sec-h.center{justify-content:center}

/* details */
.details{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:14px}
.d{text-align:center;padding:6px 4px;text-decoration:none;color:inherit;display:block;min-width:0}
.d i{display:grid;place-items:center;color:var(--accent);margin-bottom:6px}
.d i svg{width:19px;height:19px}
.d small{display:block;font-size:.58rem;letter-spacing:1.1px;color:var(--muted);text-transform:uppercase;font-weight:500}
.d b{display:block;font-size:.8rem;font-weight:600;margin-top:3px;line-height:1.3;word-break:break-word}

/* liquid glass buttons */
.stack{display:grid;gap:12px;margin-top:14px}
.btn{position:relative;display:flex;align-items:center;justify-content:center;gap:10px;min-height:54px;padding:0 18px;border-radius:18px;
  color:#fff;text-decoration:none;font:600 .98rem 'Poppins',sans-serif;border:1px solid rgba(255,255,255,.35);cursor:pointer;width:100%;overflow:hidden;
  background:linear-gradient(160deg,var(--c1),var(--c2));
  box-shadow:0 8px 18px var(--sh,rgba(125,6,16,.28)),inset 0 1.5px 0 rgba(255,255,255,.55),inset 0 -8px 14px rgba(0,0,0,.18);
  transition:transform .15s ease,box-shadow .15s ease;text-shadow:0 1px 2px rgba(0,0,0,.25)}
.btn::before{content:"";position:absolute;left:6%;right:6%;top:2px;height:46%;border-radius:16px 16px 40px 40px;
  background:linear-gradient(180deg,rgba(255,255,255,.42),rgba(255,255,255,.04));pointer-events:none}
.btn::after{content:"";position:absolute;inset:0;border-radius:inherit;background:radial-gradient(120% 90% at 85% 120%,rgba(255,255,255,.18),transparent 60%);pointer-events:none}
.btn:active{transform:scale(.975);box-shadow:0 3px 8px var(--sh,rgba(125,6,16,.3)),inset 0 1.5px 0 rgba(255,255,255,.4)}
.btn svg{width:20px;height:20px;position:relative;z-index:1;flex:none}
.btn span{position:relative;z-index:1}
.btn.red{--c1:var(--p1);--c2:var(--p2);--sh:var(--psh);color:var(--ptxt);text-shadow:var(--ptsh)}
.btn.messenger{--c1:#2d8cff;--c2:#7a4bff;--sh:rgba(60,110,255,.3)}
.btn.maps{--c1:#2b7cff;--c2:#ff9f1c;--sh:rgba(60,140,120,.3);background:linear-gradient(115deg,#2b7cff 0%,#27b36a 45%,#ffc21a 72%,#ff7a1a 100%)}
.btn.facebook{--c1:#1f7bff;--c2:#0b4fd1;--sh:rgba(20,100,240,.3)}
.btn.instagram{background:linear-gradient(115deg,#feda75,#fa7e1e 30%,#d62976 60%,#962fbf 85%,#4f5bd5);--sh:rgba(214,41,118,.28)}
.btn.tiktok{--c1:#2b2b33;--c2:#000;--sh:rgba(0,0,0,.3)}
.btn.website{--c1:#4a5568;--c2:#1f2733;--sh:rgba(0,0,0,.25)}
.btn.youtube{--c1:#ff2d2d;--c2:#a30000}
.btn.viber{--c1:#8d5cff;--c2:#4a22a8}
.btn.whatsapp{--c1:#25d366;--c2:#0b7a3a;--sh:rgba(20,150,80,.28)}
.btn.hide{display:none}

.foot{text-align:center;color:var(--muted);font-size:.72rem;padding:22px 10px 20px}
.foot a{color:inherit}
.toast{position:fixed;left:50%;bottom:calc(24px + var(--safe-b));transform:translate(-50%,20px);background:#111;color:#fff;padding:10px 16px;border-radius:12px;font-size:.82rem;opacity:0;pointer-events:none;transition:.25s;max-width:90%;text-align:center}
.toast.on{opacity:1;transform:translate(-50%,0)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}

/* brand pattern mode (set by the brand builder) */
body::before{content:"";position:fixed;inset:0;z-index:-1;background:var(--pat,none) center/cover no-repeat}
.brand-pat .brand{background:var(--card);width:max-content;margin:6px auto 16px;padding:8px 20px 8px 12px;border-radius:999px;box-shadow:0 8px 24px rgba(0,0,0,.2)}
.brand-pat.dark .brand span{color:#6f9bff}
/* optional looks (set by the brand builder or by CONFIG classes) */
body.nobadge .brand{background:none;box-shadow:none;padding:6px 0}
body.nobadge .brand span{color:#fff;text-shadow:0 2px 8px rgba(0,0,0,.45)}
body.nobadge .brand span b{color:#fff}
body.nobadge.plainbg .brand span{color:#2f5fe0;text-shadow:none}
body.nobadge.plainbg .brand span b{color:#f2a900}
body.frame .photo{width:calc(100% - 20px);margin:10px 10px 0;border-radius:22px}
body.plainbg .card{box-shadow:0 10px 34px rgba(20,20,40,.14),0 0 0 1px rgba(128,128,140,.14)}
</style>

  photoZoom: 100,                   // 100 to 300 (how much the photo is zoomed in)
  photoX: 50,                       // 0 to 100 (move the photo left / right)
  photoY: 20,                       // 0 to 100 (move the photo up / down)
  hideEmptyButtons: false,          // false = always show every button (tap on an empty one shows a reminder); true = hide buttons with no link
  allowUpload: true,                // false = hide the "Change photo" button for the public

  phone: "",                        // as people read it, e.g. 0912 345 6789 (starts with 0, the country code below is added automatically)
  countryCode: "+63",
  email: "",                        // e.g. juan@email.com
  location: "",                     // short, e.g. "Brgy. Name, City"
  maps: "",                         // Google Maps share link, e.g. https://maps.app.goo.gl/AbCdEf (empty = searches the location)
  company: "",                      // used in the saved contact, e.g. "Sample Dental Clinic"

  messenger: "",                    // username only, e.g. juan.delacruz (or a full https://m.me/... link)
  facebook: "",                     // username or full link, e.g. juan.delacruz or https://facebook.com/juan.delacruz
  instagram: "",                    // username without @, e.g. juandelacruz
  tiktok: "",                       // username without @, e.g. juandelacruz
  youtube: "",                      // full link, e.g. https://youtube.com/@yourchannel
  website: "",                      // full link, e.g. https://www.yourwebsite.com
  whatsapp: "",                     // number, e.g. 0912 345 6789
  viber: "",                        // number, e.g. 0912 345 6789

  accent: "",                       // leave empty to use this theme's colour (or type one like "#d3101c")
  footer: "Powered by TapLoop",
  pageTitle: ""                     // browser tab title (empty = name)
};
/* ===================== END OF CONFIG ===================== */

const $ = id => document.getElementById(id);
const C = CONFIG;
const ic = {
  phone:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 01-2.2 2 19.8 19.8 0 01-8.6-3.1 19.5 19.5 0 01-6-6A19.8 19.8 0 012.1 4.2 2 2 0 014.1 2h3a2 2 0 012 1.7c.1 1 .4 1.9.7 2.8a2 2 0 01-.5 2.1L8.1 9.9a16 16 0 006 6l1.3-1.3a2 2 0 012.1-.4c.9.3 1.8.6 2.8.7a2 2 0 011.7 2z"/></svg>',
  mail:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg>',
  pin:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 119.5 9 2.5 2.5 0 0112 11.5z"/></svg>',
  save:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><circle cx="9" cy="8" r="4"/><path d="M2 21c0-3.9 3.1-7 7-7s7 3.1 7 7"/><path d="M19 8v6M16 11h6"/></svg>',
  sms:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M4 3h16a2 2 0 012 2v11a2 2 0 01-2 2H9l-5 4v-4a2 2 0 01-2-2V5a2 2 0 012-2z"/></svg>',
  msgr:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.500 2 2 6.200 2 11.500c0 2.900 1.300 5.500 3.500 7.200V22l3.200-1.800c1 .3 2.100.4 3.300.4 5.500 0 10-4.200 10-9.500S17.500 2 12 2zm1 12.500l-2.500-2.700-4.900 2.700 5.400-5.700 2.600 2.700 4.800-2.700z"/></svg>',
  map:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2a7 7 0 00-7 7c0 5.3 7 13 7 13s7-7.7 7-13a7 7 0 00-7-7zm0 9.5A2.5 2.5 0 119.5 9 2.5 2.5 0 0112 11.5z"/></svg>',
  fb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M14 8V6.5c0-.7.3-1 1-1h2V2h-3c-3 0-4.5 1.8-4.5 4.5V8H7v3.5h2.5V22H14V11.5h2.7L17 8z"/></svg>',
  ig:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor"/></svg>',
  tt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 2h-3v12.5a2.7 2.7 0 11-2.7-2.7c.3 0 .6 0 .8.1V8.8a5.8 5.8 0 105.9 5.7V8.6a7.4 7.4 0 004.3 1.4V7a4.4 4.4 0 01-4.3-5z"/></svg>',
  yt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M21.6 7.2a2.6 2.6 0 00-1.8-1.8C18.2 5 12 5 12 5s-6.2 0-7.8.4A2.6 2.6 0 002.4 7.2C2 8.8 2 12 2 12s0 3.2.4 4.8a2.6 2.6 0 001.8 1.8C5.8 19 12 19 12 19s6.2 0 7.8-.4a2.6 2.6 0 001.8-1.8c.4-1.6.4-4.8.4-4.8s0-3.2-.4-4.8zM10 15V9l5.2 3z"/></svg>',
  web:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"/><path d="M2 12h20M12 2a15 15 0 010 20M12 2a15 15 0 000 20"/></svg>',
  wa:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 21l1.6-4.8A9 9 0 118 19.6z"/><path d="M9 8.500c0 3.500 3 6.500 6.500 6.500l1-1.800-2-1-1 .8c-1-.4-2-1.400-2.400-2.400l.8-1-1-2z"/></svg>',
  vb:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 2C6.500 2 3 4.500 3 9.500c0 3 1.200 5 3 6V21l3.500-3.200c.8.1 1.600.2 2.500.2 5.500 0 9-2.500 9-7.500S17.500 2 12 2z"/></svg>',
  id:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3" width="16" height="18" rx="3"/><circle cx="12" cy="10" r="2.5"/><path d="M7.500 17c.8-2 2.400-3 4.500-3s3.700 1 4.500 3"/></svg>',
  bolt:'<svg viewBox="0 0 24 24" fill="currentColor"><path d="M13 2L4 14h6l-1 8 9-12h-6z"/></svg>',
  share:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="6" cy="12" r="2.500"/><circle cx="18" cy="6" r="2.500"/><circle cx="18" cy="18" r="2.500"/><path d="M8.200 11l7.600-4M8.200 13l7.600 4"/></svg>'
};

if(C.accent) document.documentElement.style.setProperty('--accent', C.accent);
document.title = C.pageTitle || C.name;
$('icoId').innerHTML = ic.id; $('icoBolt').innerHTML = ic.bolt; $('icoShare').innerHTML = ic.share;

$('name').textContent = C.name;
$('role').textContent = C.title;
$('desc').textContent = C.description;
$('foot').textContent = C.footer;
if(!C.title) $('role').remove();
if(!C.description) $('desc').remove();

/* helpers */
const digits = s => (s||'').replace(/\D/g,'');
const intl = () => { const d = digits(C.phone); return C.phone ? C.countryCode + (d.startsWith('0') ? d.slice(1) : d) : ''; };
const link = (v, base) => !v ? '' : /^https?:\/\//i.test(v) ? v : base + v.replace(/^@/,'');
const mapsUrl = () => C.maps || (C.location ? 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(C.location) : '');
function toast(t){ const e=$('toast'); e.textContent=t; e.classList.add('on'); clearTimeout(toast.t); toast.t=setTimeout(()=>e.classList.remove('on'),2600); }

/* details row (always shown; empty items show a hint) */
const det = [
  {i:ic.phone,l:'Mobile Number',v:C.phone,e:'Add number',h:C.phone?'tel:'+intl():''},
  {i:ic.mail,l:'Email Address',v:C.email,e:'Add email',h:C.email?'mailto:'+C.email:''},
  {i:ic.pin,l:'Location',v:C.location,e:'Add location',h:mapsUrl(),t:'_blank'}
].filter(d => d.v || !C.hideEmptyButtons);
$('details').style.gridTemplateColumns = 'repeat(' + Math.max(det.length,1) + ',1fr)';
$('details').innerHTML = det.map(d => `<a class="d"${d.h?' href="'+d.h+'"':''}${d.t&&d.h?' target="_blank" rel="noopener"':''}><i>${d.i}</i><small>${d.l}</small><b></b></a>`).join('');
[...$('details').children].forEach((a,i)=>{ const b=a.querySelector('b'); b.textContent = det[i].v || det[i].e; if(!det[i].v) b.style.opacity='.45'; });
if(!det.length) $('details').parentElement.remove();

/* vCard */
function saveContact(){
  const esc = s => (s||'').replace(/([,;\\])/g,'\\$1').replace(/\n/g,'\\n');
  const parts = (C.name||'').trim().split(/\s+/);
  const last = parts.length > 1 ? parts.pop() : '', first = parts.join(' ');
  const L = ['BEGIN:VCARD','VERSION:3.0','N:'+esc(last)+';'+esc(first)+';;;','FN:'+esc(C.name)];
  if(C.company) L.push('ORG:'+esc(C.company));
  if(C.title) L.push('TITLE:'+esc(C.title));
  if(C.phone) L.push('TEL;TYPE=CELL:'+intl());
  if(C.email) L.push('EMAIL;TYPE=INTERNET:'+C.email);
  if(C.location) L.push('ADR;TYPE=WORK:;;'+esc(C.location)+';;;;');
  const w = C.website || link(C.facebook,'https://facebook.com/'); if(w) L.push('URL:'+w);
  L.push('END:VCARD');
  const blob = new Blob([L.join('\r\n')], {type:'text/vcard;charset=utf-8'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = (C.name||'contact').replace(/[^\w]+/g,'_') + '.vcf';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href), 4000);
  toast('Contact file ready - open it to save');
}

/* buttons: every button is always shown, like the reference design */
function btn(cls, icon, label, href, ext){
  const el = document.createElement(href ? 'a' : 'button');
  el.className = 'btn ' + cls;
  if(href){ el.href = href; if(ext){ el.target='_blank'; el.rel='noopener'; } }
  else { el.type='button'; el.onclick = () => toast('Add your ' + label + ' details in CONFIG'); el.style.opacity='.8'; }
  el.innerHTML = icon + '<span></span>'; el.querySelector('span').textContent = label;
  return el;
}
function add(box, cls, icon, label, href, ext){
  if(!href && C.hideEmptyButtons) return 0;
  box.appendChild(btn(cls, icon, label, href, ext)); return 1;
}
const acts = $('actions');
const saveBtn = btn('red', ic.save, 'Save Contact'); saveBtn.onclick = saveContact; saveBtn.style.opacity = ''; acts.appendChild(saveBtn);
add(acts,'red',ic.phone,'Call', C.phone ? 'tel:'+intl() : '');
add(acts,'red',ic.sms,'Text / SMS', C.phone ? 'sms:'+intl() : '');
add(acts,'red',ic.mail,'Send Email', C.email ? 'mailto:'+C.email : '');
add(acts,'messenger',ic.msgr,'Messenger', link(C.messenger,'https://m.me/'), true);
add(acts,'maps',ic.map,'Google Maps', mapsUrl(), true);

const soc = $('social'); let n = 0;
n += add(soc,'facebook',ic.fb,'Facebook', link(C.facebook,'https://facebook.com/'), true);
n += add(soc,'instagram',ic.ig,'Instagram', link(C.instagram,'https://instagram.com/'), true);
n += add(soc,'tiktok',ic.tt,'TikTok', link(C.tiktok,'https://tiktok.com/@'), true);
n += add(soc,'youtube',ic.yt,'YouTube', C.youtube, true);
n += add(soc,'whatsapp',ic.wa,'WhatsApp', C.whatsapp ? (/^https?:/i.test(C.whatsapp) ? C.whatsapp : 'https://wa.me/'+(C.countryCode+digits(C.whatsapp).replace(/^0/,'')).replace('+','')) : '', true);
n += add(soc,'viber',ic.vb,'Viber', C.viber ? 'viber://chat?number='+encodeURIComponent(C.countryCode+digits(C.viber).replace(/^0/,'')) : '', true);
n += add(soc,'website',ic.web,'Website', C.website, true);
if(!n) $('socialSec').remove();

/* photo: config image, saved upload, or tap-to-upload. Adjustable: zoom + move */
const photo = $('photo'), img = $('photoImg'), KEY = 'taploop-photo:' + location.pathname;
const P = { zoom: C.photoZoom || 100, px: (C.photoX ?? 50), py: (C.photoY ?? 20) };
const clamp = (v,a,b) => Math.min(b, Math.max(a, v));
let curSrc = '', adjusting = false, LX = 0, LY = 0;

function layout(){
  if(!photo.classList.contains('has') || !img.naturalWidth) return;
  const fw = photo.clientWidth, fh = photo.clientHeight, iw = img.naturalWidth, ih = img.naturalHeight;
  const s = Math.max(fw/iw, fh/ih) * (P.zoom/100), w = iw*s, h = ih*s;
  LX = fw - w; LY = fh - h;
  img.style.width = w + 'px'; img.style.height = h + 'px';
  img.style.left = (LX * P.px/100) + 'px'; img.style.top = (LY * P.py/100) + 'px';
}
function syncSliders(){ $('aZ').value = P.zoom; $('aX').value = 100 - P.px; $('aY').value = 100 - P.py; }
function setPhoto(src){ curSrc = src; img.onload = layout; img.src = src; photo.classList.add('has'); syncSliders(); setTools(); }
function commit(){
  try{ localStorage.setItem(KEY, JSON.stringify({src:curSrc, zoom:P.zoom, px:P.px, py:P.py})); }catch(e){}
  try{ if(window.parent !== window) window.parent.postMessage({tlPhoto:{src:curSrc, zoom:P.zoom, px:P.px, py:P.py}}, '*'); }catch(e){}
}
function setTools(){
  const has = photo.classList.contains('has');
  const b = $('adjBtn'); if(!b) return;
  b.style.display = (has && C.allowUpload) ? '' : 'none';
}
window.addEventListener('resize', layout);
if('ResizeObserver' in window) new ResizeObserver(layout).observe(photo);

if(C.photo) setPhoto(C.photo);
else { try{ const s = localStorage.getItem(KEY); if(s){
  if(s.charAt(0) === '{'){ const o = JSON.parse(s); P.zoom = o.zoom; P.px = o.px; P.py = o.py; setPhoto(o.src); } else setPhoto(s);
} }catch(e){} }
setTools();

if(!C.allowUpload){ $('editBtn').remove(); $('adjBtn').remove(); photo.style.cursor='default'; }
else {
  const pick = () => $('file').click();
  photo.addEventListener('click', () => { if(!photo.classList.contains('has') && !adjusting) pick(); });
  photo.addEventListener('keydown', e => { if((e.key==='Enter'||e.key===' ') && !photo.classList.contains('has')){ e.preventDefault(); pick(); } });
  $('editBtn').addEventListener('click', e => { e.stopPropagation(); pick(); });
  $('adjBtn').addEventListener('click', e => { e.stopPropagation(); setAdjust(!adjusting); });
  $('file').addEventListener('click', e => e.stopPropagation());
  $('file').addEventListener('change', e => {
    const f = e.target.files[0]; if(!f) return;
    const r = new FileReader();
    r.onload = () => {
      const im = new Image();
      im.onload = () => {
        const s = Math.min(1, 1000 / Math.max(im.width, im.height));
        const cv = document.createElement('canvas'); cv.width = Math.round(im.width*s); cv.height = Math.round(im.height*s);
        cv.getContext('2d').drawImage(im, 0, 0, cv.width, cv.height);
        P.zoom = 100; P.px = 50; P.py = 20;
        setPhoto(cv.toDataURL('image/jpeg', .86));
        commit();
        e.target.value = '';
      };
      im.src = r.result;
    };
    r.readAsDataURL(f);
  });

  function setAdjust(on){
    adjusting = on; photo.classList.toggle('adjusting', on); $('adj').hidden = !on;
    $('adjBtn').lastChild.textContent = on ? ' Adjusting...' : ' Adjust';
    if(on){ syncSliders(); toast('Drag the photo or use the sliders'); }
  }
  $('aDone').onclick = () => setAdjust(false);
  $('aReset').onclick = () => { P.zoom = 100; P.px = 50; P.py = 20; syncSliders(); layout(); commit(); };
  $('aZ').addEventListener('input', e => { P.zoom = +e.target.value; layout(); });
  $('aX').addEventListener('input', e => { P.px = 100 - e.target.value; layout(); });
  $('aY').addEventListener('input', e => { P.py = 100 - e.target.value; layout(); });
  ['aZ','aX','aY'].forEach(id => $(id).addEventListener('change', commit));

  let drag = null;
  photo.addEventListener('pointerdown', e => {
    if(!adjusting) return;
    drag = {x:e.clientX, y:e.clientY, px:P.px, py:P.py};
    try{ photo.setPointerCapture(e.pointerId); }catch(err){}
  });
  photo.addEventListener('pointermove', e => {
    if(!drag) return;
    if(LX < -1) P.px = clamp(drag.px + (e.clientX - drag.x) / LX * 100, 0, 100);
    if(LY < -1) P.py = clamp(drag.py + (e.clientY - drag.y) / LY * 100, 0, 100);
    syncSliders(); layout();
  });
  const end = () => { if(drag){ drag = null; commit(); } };
  photo.addEventListener('pointerup', end); photo.addEventListener('pointercancel', end);
}
</script>
</body>
</html>
